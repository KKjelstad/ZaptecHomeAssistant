version: '3.8'

services:
  zaptec-bridge:
    build: .
    container_name: zaptec-bridge
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Europe/Oslo
      - ZAPTEC_PASSWORD=${ZAPTEC_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
